<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    
    <style>
        /* إيقاف الهوامش الافتراضية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        
        body {
            background-image: url('Shaa.jpeg'); 
            background-size: 100% 100%;       /* تجبر الصورة على الانضغاط لتناسب أبعاد الشاشة بالظبط */
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;                      /* طول الشاشة بالكامل */
            width: 100vw;                       /* عرض الشاشة بالكامل */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;                   /* تمنع ظهور شريط التمرير الجانبي */
        }

        .welcome-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        /* تنسيق زر NEXT بالأخضر */
        .next-btn {
            display: inline-block;
            padding: 12px 40px;
            background-color: #2ed573; 
            color: white;             
            text-decoration: none;    
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 10px;      
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); 
            transition: all 0.3s ease; 
            
            /* مكان الزر في أسفل الشاشة */
            margin-top: auto; 
            margin-bottom: 25px; /* يرتفع مسافة بسيطة عن الحافة السفلية */
        }

        .next-btn:hover {
            background-color: #26af5f; 
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <a href="first.html" class="next-btn">NEXT</a>
    </div>

</body>
</html>
