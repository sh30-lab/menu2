<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة </title>
    <style>
        
        body {
            background-color: #5eb944; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* (عمودين) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 450px;
            width: 100%;
        }

        
        .item-card {
            background-color: rgba(255, 255, 255, 0.25); 
            border-radius: 20px;
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        }

        
        .image-box {
            background-color: white;
            margin: 8px;
            border-radius: 15px;
            padding: 10px;
            aspect-ratio: 1 / 1; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-box img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

    
        .item-label {
            padding: 12px 5px;
            font-weight: 600;
            color: #2d2d2d;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="menu-grid">
    
        <div class="item-card">
            <div class="image-box">
                <img src="st.jpeg">
            </div>
            <div class="item-label">عصير فراولة <br>Çilek suyu<br>Strawberry juice</div>
        </div>

        
       <div class="item-card" >
    <div class="image-box" >
        <img src="or.jpeg" >
    </div>
    <div class="item-label">عصير برتقال <br>Orange Juice <br>Portakal Suyu</div>
        </div>

    
      <div class="item-card" >
    <div class="image-box" >
        <img src="an.jpeg" >
    </div>
    <div class="item-label">عصير اناناس <br>Ananas suyu<br>Pineapple juice</div>
        </div>

    
     <div class="item-card">
         <div class="image-box">
                <img src="tf.jpeg">
             </div>
            <div class="item-label">عصير تفاح <br>Elma Suyu<br>Apple Juice</div>
        </div>



        <div class="item-card">
            <div class="image-box">
                <img src="nn.jpeg">
            </div>
            <div class="item-label">عصير ليمون ونعناع<br>Limon ve Nane Suyu<br>Lemon and Mint Juice</div>
        </div>

        <div class="item-card" style="display: flex; flex-direction: column; height: 100%; overflow: hidden;">
    <div class="image-box" style="width: 100%; height: 200px; overflow: hidden;">
        <img src="mn.jpeg" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    </div>
    <div class="item-label" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">عصير منجا <br>Mango Suyu<br>Mango Juice</div>
        </div>

    
 
    </div>
 





</body>
</html>
