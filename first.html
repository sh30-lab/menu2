<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoa'a Menu</title>
    <style>
    
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

    
        .navbar {
            width: 100%;
            background-color: #5eb944; 
            padding: 15px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: black;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            background-color: white;
            color: #5eb944;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

    
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        
        .category-card {
            background-color: #5eb944;
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none; 
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .category-card:active {
            transform: scale(0.95); 
        }

        .image-container {
            background-color: rgb(255, 255, 255);
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .category-name {
            color: black;
            text-align: center;
            padding: 12px;
            font-size: 18px;
            fonnt-weight: bold;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo" src="logo.jpeg"></div>
    
        <div style="font-size: 24px;">بيت الضيافة الأصيل</div>
    </div>
    <div class="banner">


  <div class="overlay-text">

  </div>
</div>

    <div class="menu-grid">
        
        <a href="appetizers.html" class="category-card">
            <div class="image-container">
                <img src= "mt.jpeg">
            </div>
            <div class="category-name">المقبلات<br>appetizers<br>Meza</div>
        </a>

        <a href="breakfast.html" class="category-card">
            <div class="image-container">
                <img src="br.jpeg">
            </div>
            <div class="category-name">الإفطار<br>Breakfast<br></div>
        </a>

        <a href="pies.html" class="category-card">
            <div class="image-container">
                <img src="pie.jpeg">
            </div>
            <div class="category-name">فطائر<br>Pies<br>Turtalar</div>
        </a>

        <a href="lunch.html" class="category-card">
            <div class="image-container">
                <img src="lb.png">
            </div>
            <div class="category-name">الغداء<br>Lunch<br></div>
        </a>

        <a href="dessert.html" class="category-card">
            <div class="image-container">
               <img src="de.jpeg" >
            </div>
            <div class="category-name">الحلويات<br>Dessert<br></div>
        </a>

        <a href="eastern dessert.html" class="category-card">
            <div class="image-container">
                <img src="c.jpeg">
            </div>
            <div class="category-name"> الحلويات الشرقية<br>Oriental Sweets<br>  </div>
        
        </a>

<a href="fresh juice .html" class="category-card">
            <div class="image-container">
                <img src="d.jpeg">
            </div>
            <div class="category-name">  العصائر الطبيعية<br>Fresh juice<br></div>
        </a>
        <a href="drinks.html" class="category-card">
            <div class="image-container">
                <img src="">
            </div>
            <div class="category-name">مشروبات <br>Drinks<br></div>
        </a>
    </div>

</body>
</html>
